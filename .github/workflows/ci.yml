name: Rust CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Red Team Tests
        run: make redteam
      - name: FFI Red Team
        run: make redteam-ffi
      - name: Immunity Tests
        run: make immunity
      - name: Stress Tests
        run: make stress
      - name: Zero Allocation Verification
        run: make zero-alloc
      - name: Bench (compile only)
        run: cargo bench --workspace --no-run
