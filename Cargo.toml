[workspace]
members = ["risk-gate", "risk_core", "risk-gate-wasm", "examples/hot_swap_demo"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Risk Hotpath Team"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
prometheus = "0.13"
once_cell = "1.19"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
axum = { version = "0.7", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
