[package]
name = "risk_core"
version = "0.1.0"
edition = "2021"
authors = ["Risk Hotpath Team"]
license = "MIT"

[features]
clickhouse = ["dep:clickhouse"]

[dependencies]
tokio = { workspace = true }
prometheus = { workspace = true }
once_cell = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
risk-gate = { path = "../risk-gate" }
axum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clickhouse = { version = "0.12", optional = true }

[dev-dependencies]
pretty_assertions = "1"
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "throughput"
harness = false
